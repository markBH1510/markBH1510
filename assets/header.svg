<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="60%" stop-color="#7fe7ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12324a" stroke-width="0.6"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
      .radar { transform-origin: 960px 160px; animation: spin 4s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .blip { animation: blip 4s ease-out infinite; opacity: 0; }
      .b2 { animation-delay: 1.3s; } .b3 { animation-delay: 2.6s; }
      @keyframes blip { 0%{opacity:0} 8%{opacity:1} 60%{opacity:0.15} 100%{opacity:0} }
      .dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
      .rise { opacity: 0; animation: rise .9s ease-out forwards; }
      .d1{animation-delay:.1s} .d2{animation-delay:.45s} .d3{animation-delay:.8s} .d4{animation-delay:1.15s}
      @keyframes rise { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from{transform:translateY(-40px)} to{transform:translateY(360px)} }
      .caret { animation: pulse 1s steps(1) infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
    <rect class="scan" x="0" y="0" width="1200" height="40" fill="#00e5ff" opacity="0.035"/>

    <!-- Radar -->
    <circle cx="960" cy="160" r="150" fill="url(#glow)"/>
    <g fill="none" stroke="#1d5a78" stroke-width="1">
      <circle cx="960" cy="160" r="120"/>
      <circle cx="960" cy="160" r="85"/>
      <circle cx="960" cy="160" r="50"/>
      <line x1="840" y1="160" x2="1080" y2="160"/>
      <line x1="960" y1="40" x2="960" y2="280"/>
    </g>
    <g class="radar">
      <path d="M960 160 L1080 160 A120 120 0 0 0 1044.85 75.15 Z" fill="url(#sweep)" opacity="0.55"/>
      <line x1="960" y1="160" x2="1080" y2="160" stroke="#00e5ff" stroke-width="2"/>
    </g>
    <circle class="blip"    cx="1018" cy="112" r="5" fill="#ff3b5c"/>
    <circle class="blip b2" cx="905"  cy="205" r="4" fill="#ffb020"/>
    <circle class="blip b3" cx="1001" cy="232" r="4" fill="#00e5ff"/>
    <text class="mono" x="1026" y="104" font-size="11" fill="#ff7a90" opacity="0.9">C2 beacon?</text>
    <circle cx="960" cy="160" r="3" fill="#00e5ff"/>

    <!-- Text block -->
    <g class="rise d1">
      <circle class="dot" cx="70" cy="70" r="5" fill="#00ff9c"/>
      <text class="mono" x="84" y="75" font-size="14" fill="#5fd3a0" letter-spacing="2">ONLINE · HUNTING · 0 UNPARSED LOGS</text>
    </g>
    <text class="sans rise d2" x="64" y="150" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="1">Mark Bahaa Helmy</text>
    <text class="mono rise d3" x="66" y="194" font-size="20" fill="#9fb4c8">Cyber Security &amp; Infrastructure Engineer</text>
    <g class="rise d4">
      <text class="mono" x="66" y="250" font-size="16" fill="#00e5ff">$</text>
      <text class="mono" x="86" y="250" font-size="16" fill="#c9d6e2">I read the logs everyone else skips<tspan fill="#00e5ff" class="caret">▌</tspan></text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#1b3a52"/>
</svg>

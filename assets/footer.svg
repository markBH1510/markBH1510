<svg xmlns='http://www.w3.org/2000/svg' width='385' height='130' viewBox='0 0 385 130'><defs>    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/><stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">

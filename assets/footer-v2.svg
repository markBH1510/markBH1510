<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12324a" stroke-width="0.6"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="130" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
      .rise { opacity: 0; animation: rise .8s ease-out forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-30px); } to { transform: translateY(160px); } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="130" fill="url(#bg)"/>
    <rect width="1200" height="130" fill="url(#grid)" opacity="0.45"/>
    <rect class="scan" width="1200" height="30" fill="#00e5ff" opacity="0.04"/>

    <!-- Content Centered at X=600 -->
    <text class="sans rise" x="600" y="56" font-size="25" font-weight="800" fill="#e6f7ff" text-anchor="middle" letter-spacing="0.5">
      Got a weird log line nobody can explain?
    </text>

    <g class="rise" style="animation-delay: 0.3s;">
      <text class="mono" x="600" y="94" font-size="16" fill="#00e5ff" text-anchor="middle">
        send it over. I will find who wrote it <tspan class="caret" fill="#00e5ff">▌</tspan>
      </text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="129" rx="18" fill="none" stroke="#1b3a52"/>
</svg>
